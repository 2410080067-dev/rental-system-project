# ============================================
# PRODUCTION CONFIGURATION - Rental System
# ============================================
# Activated when: SPRING_PROFILES_ACTIVE=prod
# All ${VAR:default} values are read from environment variables on your host

# ------------------------------------------
# Server
# ------------------------------------------
server.port=${PORT:8081}
server.servlet.context-path=/api

# ------------------------------------------
# MySQL Cloud Database
# Set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD as env vars on Render
# ------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/rental_system_db?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (tuned for free-tier cloud DB limits)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# ------------------------------------------
# JPA / Hibernate
# ------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------------------
# JWT
# ------------------------------------------
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_A_64_CHAR_RANDOM_STRING}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ------------------------------------------
# Swagger / OpenAPI
# ------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ------------------------------------------
# Misc
# ------------------------------------------
spring.h2.console.enabled=false

# ------------------------------------------
# CORS (comma-separated frontend URLs)
# ------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-frontend.vercel.app}

# ------------------------------------------
# Logging
# ------------------------------------------
logging.level.root=WARN
logging.level.com.rental=INFO
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN
